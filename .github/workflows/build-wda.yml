name: Package compatible WebDriverAgent IPA for iOS 15

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Download official Appium WDA device build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/appium/WebDriverAgent/releases/download/v5.15.6/WebDriverAgentRunner-Runner.zip \
            --output WDA-device.zip
          mkdir extracted
          unzip -q WDA-device.zip -d extracted
          APP_PATH="$(find extracted -type d -name 'WebDriverAgentRunner-Runner.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p package/Payload
          find "$APP_PATH" -type d \( -name '*.dSYM' -o -name 'XC*.framework' \) -prune -exec rm -rf {} +
          ditto "$APP_PATH" package/Payload/WebDriverAgentRunner-Runner.app
          (cd package && /usr/bin/zip -qry ../WebDriverAgentRunner-iOS15-unsigned.ipa Payload)
          unzip -t WebDriverAgentRunner-iOS15-unsigned.ipa
          shasum -a 256 WebDriverAgentRunner-iOS15-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-iOS15-unsigned-ipa
          path: WebDriverAgentRunner-iOS15-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
